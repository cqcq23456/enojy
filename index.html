<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출퇴근 기록</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eef1ee;--cd:#fff;--tx:#17201c;--mu:#66736c;--bd:#d8dfda;--pr:#0f5c4d;--in:#0f766e;--out:#b45309;--er:#6d28d9;--dn:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#121714;--cd:#1b221e;--tx:#edf2ee;--mu:#9aa89f;--bd:#2c3631;--pr:#5fd0b8;--in:#4fd1c0;--out:#f0a24f;--er:#b9a0ff;--dn:#ff8a80}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;background-color:var(--bg)}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px}
h1{font-size:20px;margin:8px 0 12px}h2{font-size:17px;margin:0 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;font-weight:600;font-size:15px}
.tabs button.on{background:var(--pr);color:var(--bg);border-color:var(--pr)}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px;font-family:inherit}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pr);outline-offset:2px}
.pb{width:100%;padding:14px;border:0;border-radius:10px;background:var(--pr);color:var(--bg);font-size:16px;font-weight:700;margin-top:14px}
.gb{padding:9px 12px;border:1px solid var(--bd);border-radius:9px;background:var(--cd);color:var(--tx);font-size:14px}
.mu{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.act{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.act button{flex:0 0 130px;padding:18px 0;border:0;border-radius:12px;font-size:20px;font-weight:800;color:#fff}
.act button:disabled{opacity:.35;cursor:not-allowed}
#b-in{background:var(--in)}#b-out{background:var(--out)}#b-early{background:var(--er)}
.bar{padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--bd);font-size:14px;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--bd);padding:7px 4px;text-align:center;vertical-align:middle}
td img{display:block;margin:2px auto 0;height:26px;background:#fff;border-radius:3px}
.ed{border:0;background:none;color:var(--mu);font-size:13px}
.sc{overflow-x:auto}
dialog{width:min(92vw,520px);border:0;border-radius:14px;padding:16px;background:var(--cd);color:var(--tx)}
dialog::backdrop{background:rgba(0,0,0,.55)}
#cv{width:100%;aspect-ratio:5/2;background:#fff;border:2px solid var(--bd);border-radius:10px;touch-action:none;display:block}
.qr{text-align:center}.qr div{display:inline-block;background:#fff;padding:10px;border-radius:10px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
[hidden]{display:none!important}
@media print{.noprint{display:none!important}body{background:#fff;color:#000}.cd{border:0;padding:0}td img{height:30px}}
</style>
</head>
<body>
<main>
<h1 class="noprint">출퇴근 기록</h1>
<div class="tabs noprint"><button id="t-w" class="on">근로자</button><button id="t-a">관리자</button></div>

<!-- 근로자 -->
<section id="w">
  <div id="reg" class="cd">
    <h2>본인 정보 입력</h2>
    <form id="rf" autocomplete="off">
      <label for="nm">이름</label><input id="nm" required>
      <label for="bd">생년월일</label><input id="bd" type="date" required>
      <label for="ph">전화번호</label><input id="ph" type="tel" inputmode="numeric" placeholder="01012345678" required>
      <button class="pb">확인</button>
    </form>
    <p class="mu">처음이면 자동으로 등록되고, 이미 등록된 정보면 본인 확인 후 진행합니다.</p>
  </div>
  <div id="cf" class="cd" hidden>
    <h2>이미 등록된 정보입니다</h2>
    <p id="cft" style="font-size:18px;font-weight:700"></p>
    <p>본인이 맞습니까?</p>
    <div class="row"><button class="gb" id="cfn">아니요</button><button class="pb" id="cfy" style="margin:0">네, 본인입니다</button></div>
  </div>
  <div id="att" hidden>
    <div class="cd">
      <div class="row" style="justify-content:space-between"><h2 id="who" style="margin:0"></h2><button class="gb" id="out-u" style="flex:0 0 auto">다른 사람</button></div>
      <div class="mu" id="today"></div>
      <div class="bar" id="bar"></div>
      <div class="act"><button id="b-in" data-t="in">출근</button><span id="s-in" class="mu"></span></div>
      <div class="act"><button id="b-out" data-t="out">퇴근</button><span id="s-out" class="mu"></span></div>
      <div class="act" style="margin:0"><button id="b-early" data-t="early">조퇴</button><span id="s-early" class="mu"></span></div>
    </div>
    <p class="mu">출근·퇴근·조퇴는 하루에 각각 한 번만 기록할 수 있고, 기록할 때마다 서명이 필요합니다.</p>
  </div>
</section>

<!-- 관리자 -->
<section id="a" hidden>
  <div id="lock" class="cd">
    <h2>관리자 확인</h2>
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <button class="pb" id="pinb">들어가기</button>
    <p class="mu">처음 PIN은 0000입니다. 들어간 뒤 설정에서 바꿔 주세요.</p>
  </div>
  <div id="pn" hidden>
    <div class="tabs noprint"><button id="s1" class="on">명단</button><button id="s2">QR·설정</button></div>
    <div id="p1">
      <div class="cd">
        <div class="noprint">
          <label for="day">날짜</label><input id="day" type="date">
          <div class="row" style="margin-top:10px"><button class="gb" id="cp">이름 복사</button><button class="gb" id="xl">엑셀 다운로드</button><button class="gb" id="pr">인쇄</button></div>
        </div>
        <h2 style="margin-top:14px" id="ttl"></h2>
        <div class="sc"><table><thead><tr><th>#</th><th>이름</th><th>출근</th><th>퇴근</th><th>조퇴</th></tr></thead><tbody id="tb"></tbody></table></div>
      </div>
      <div class="cd noprint">
        <h2>기록 직접 추가</h2>
        <div class="row"><select id="aw"></select><select id="at"><option value="in">출근</option><option value="out">퇴근</option><option value="early">조퇴</option></select><input id="am" type="time"></div>
        <button class="pb" id="ab">추가</button>
      </div>
    </div>
    <div id="p2" hidden>
      <div class="cd qr"><h2>출근 QR</h2><div id="q-in"></div><p class="mu">출근만 가능</p></div>
      <div class="cd qr"><h2>퇴근 QR</h2><div id="q-out"></div><p class="mu">퇴근·조퇴 가능</p></div>
      <div class="cd noprint">
        <h2>설정</h2>
        <label for="bu">QR에 들어갈 주소 (배포한 웹 주소)</label><input id="bu" type="url">
        <button class="pb" id="bus">주소 저장</button>
        <label for="np">새 PIN</label><input id="np" type="password" inputmode="numeric">
        <button class="pb" id="nps">PIN 변경</button>
        <button class="gb noprint" id="qp" style="margin-top:12px;width:100%">QR 인쇄</button>
      </div>
    </div>
  </div>
</section>
</main>

<dialog id="sg">
  <h2 id="sgt"></h2>
  <p class="mu" style="margin:0 0 8px">아래 칸에 손가락으로 서명해 주세요.</p>
  <canvas id="cv" width="600" height="240"></canvas>
  <div class="row" style="margin-top:12px"><button class="gb" id="sgc">지우기</button><button class="gb" id="sgx">취소</button><button class="pb" id="sgs" style="margin:0">서명 저장</button></div>
</dialog>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s);
const L=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('저장 공간이 부족합니다')}};
const z=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());
const hm=d=>z(d.getHours())+':'+z(d.getMinutes());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const T={in:'출근',out:'퇴근',early:'조퇴'};
const mask=p=>p.slice(0,3)+'-****-'+p.slice(-4);
const homeUrl=location.href.split(/[?#]/)[0];
let workers=L('workers',[]),recs=L('recs',[]),pin=L('pin','0000'),base=L('base',homeUrl),pend=null,sigT=null;
const qa=new URLSearchParams(location.search).get('a');
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

/* 탭 */
function mode(m){$('#w').hidden=m!=='w';$('#a').hidden=m!=='a';$('#t-w').classList.toggle('on',m==='w');$('#t-a').classList.toggle('on',m==='a')}
$('#t-w').onclick=()=>mode('w');$('#t-a').onclick=()=>mode('a');

/* 근로자 */
function show(id){['reg','cf','att'].forEach(k=>$('#'+k).hidden=k!==id)}
const wk=()=>workers.find(w=>w.id===L('cur',null));
function goW(){if(!wk()){show('reg');return}show('att');renderAtt()}
function renderAtt(){
  const w=wk(),t=ymd(new Date()),mine=recs.filter(r=>r.id===w.id&&r.date===t);
  $('#who').textContent=w.name+'님';$('#today').textContent=t;
  $('#bar').textContent=qa==='in'?'출근 QR로 접속했습니다':qa==='out'?'퇴근 QR로 접속했습니다 (퇴근·조퇴 가능)':'출근 또는 퇴근 QR코드를 스캔해서 접속해 주세요';
  ['in','out','early'].forEach(k=>{
    const r=mine.find(x=>x.type===k),ok=qa==='in'?k==='in':qa==='out'?k!=='in':false;
    $('#b-'+k).disabled=!!r||!ok;$('#s-'+k).textContent=r?r.time+' 기록 완료':'기록 전';
  });
}
$('#rf').onsubmit=e=>{
  e.preventDefault();
  const n=$('#nm').value.trim(),b=$('#bd').value,p=$('#ph').value.replace(/\D/g,'');
  if(!n||!b||p.length<9)return toast('이름, 생년월일, 전화번호를 정확히 입력해 주세요');
  const same=workers.find(w=>w.name===n&&w.birth===b&&w.phone===p);
  if(same){pend=same;$('#cft').textContent=same.name+' / '+same.birth+' / '+mask(same.phone);return show('cf')}
  if(workers.some(w=>w.phone===p))return toast('이 전화번호는 다른 정보로 이미 등록되어 있습니다');
  const w={id:'w'+Date.now(),name:n,birth:b,phone:p};
  workers.push(w);S('workers',workers);S('cur',w.id);$('#rf').reset();goW();
};
$('#cfy').onclick=()=>{S('cur',pend.id);$('#rf').reset();goW()};
$('#cfn').onclick=()=>show('reg');
$('#out-u').onclick=()=>{S('cur',null);goW()};

/* 서명 */
const cv=$('#cv'),cx=cv.getContext('2d');let dr=false,has=false;
function clr(){cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);cx.strokeStyle='#111';cx.lineWidth=5;cx.lineCap=cx.lineJoin='round';has=false}
const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height]};
cv.onpointerdown=e=>{dr=has=true;cv.setPointerCapture(e.pointerId);const[x,y]=pos(e);cx.beginPath();cx.moveTo(x,y);cx.lineTo(x+.1,y);cx.stroke()};
cv.onpointermove=e=>{if(!dr)return;const[x,y]=pos(e);cx.lineTo(x,y);cx.stroke()};
cv.onpointerup=cv.onpointercancel=()=>dr=false;
document.querySelectorAll('.act button').forEach(b=>b.onclick=()=>{sigT=b.dataset.t;$('#sgt').textContent=T[sigT]+' 서명';clr();$('#sg').showModal()});
$('#sgc').onclick=clr;$('#sgx').onclick=()=>$('#sg').close();
$('#sgs').onclick=()=>{
  if(!has)return toast('서명을 먼저 해 주세요');
  const w=wk(),n=new Date(),d=ymd(n);
  if(recs.some(r=>r.id===w.id&&r.date===d&&r.type===sigT)){$('#sg').close();return toast('오늘 이미 기록했습니다')}
  const o=document.createElement('canvas');o.width=300;o.height=120;o.getContext('2d').drawImage(cv,0,0,300,120);
  recs.push({id:w.id,date:d,type:sigT,time:hm(n),sig:o.toDataURL('image/png')});
  S('recs',recs);$('#sg').close();renderAtt();toast(T[sigT]+' 기록 완료 ('+hm(n)+')');
};

/* 관리자 */
$('#t-a').addEventListener('click',()=>{$('#day').value=$('#day').value||ymd(new Date())});
$('#pinb').onclick=()=>{
  if($('#pin').value!==pin)return toast('PIN이 맞지 않습니다');
  $('#pin').value='';$('#lock').hidden=true;$('#pn').hidden=false;initA();
};
function sub(n){$('#p1').hidden=n!==1;$('#p2').hidden=n!==2;$('#s1').classList.toggle('on',n===1);$('#s2').classList.toggle('on',n===2);if(n===2)drawQR()}
$('#s1').onclick=()=>sub(1);$('#s2').onclick=()=>sub(2);
function initA(){
  $('#day').value=$('#day').value||ymd(new Date());$('#bu').value=base;
  $('#aw').innerHTML=workers.map(w=>'<option value="'+w.id+'">'+esc(w.name)+'</option>').join('')||'<option value="">등록된 근로자 없음</option>';
  $('#am').value=hm(new Date());renderA();
}
$('#day').onchange=renderA;
function renderA(){
  const d=$('#day').value,rs=recs.filter(r=>r.date===d),ids=[...new Set(rs.map(r=>r.id))];
  $('#ttl').textContent=d+' 출퇴근 명단 (출근 '+rs.filter(r=>r.type==='in').length+'명)';
  const cell=(id,t)=>{const r=rs.find(x=>x.id===id&&x.type===t);
    return '<td data-id="'+id+'" data-t="'+t+'">'+(r?r.time+(r.sig?'<img alt="서명" src="'+r.sig+'">':''):'-')+'<button class="ed noprint" aria-label="수정">수정</button></td>'};
  $('#tb').innerHTML=ids.map((id,i)=>{const w=workers.find(x=>x.id===id);
    return '<tr><td>'+(i+1)+'</td><td>'+esc(w?w.name:'(삭제됨)')+'</td>'+cell(id,'in')+cell(id,'out')+cell(id,'early')+'</tr>'}).join('')
    ||'<tr><td colspan="5" class="mu">이 날짜의 기록이 없습니다</td></tr>';
}
function setRec(id,t,v){
  const d=$('#day').value,i=recs.findIndex(r=>r.id===id&&r.date===d&&r.type===t);
  if(v===''){if(i>=0)recs.splice(i,1)}
  else{const m=/^(\d{1,2}):(\d{2})$/.exec(v);if(!m||+m[1]>23||+m[2]>59)return toast('시간은 09:30 형식으로 입력해 주세요');
    const tm=z(+m[1])+':'+m[2];if(i>=0)recs[i].time=tm;else recs.push({id,date:d,type:t,time:tm,sig:''})}
  S('recs',recs);renderA();
}
$('#tb').onclick=e=>{
  const b=e.target.closest('.ed');if(!b)return;
  const td=b.parentElement,id=td.dataset.id,t=td.dataset.t,r=recs.find(x=>x.id===id&&x.date===$('#day').value&&x.type===t);
  const v=prompt(T[t]+' 시간 (예: 09:30)\n비우면 기록을 삭제합니다',r?r.time:'');
  if(v!==null)setRec(id,t,v.trim());
};
$('#ab').onclick=()=>{const id=$('#aw').value;if(!id)return toast('근로자가 없습니다');if(!$('#am').value)return toast('시간을 입력해 주세요');setRec(id,$('#at').value,$('#am').value)};
$('#cp').onclick=async()=>{
  const d=$('#day').value,names=recs.filter(r=>r.date===d&&r.type==='in').map(r=>(workers.find(w=>w.id===r.id)||{}).name).filter(Boolean).join('\n');
  if(!names)return toast('복사할 출근자가 없습니다');
  try{await navigator.clipboard.writeText(names)}catch(e){const t=document.createElement('textarea');t.value=names;document.body.append(t);t.select();document.execCommand('copy');t.remove()}
  toast('출근자 이름을 복사했습니다');
};
$('#xl').onclick=()=>{
  const d=$('#day').value,ids=[...new Set(recs.filter(r=>r.date===d).map(r=>r.id))];
  const tm=(id,t)=>(recs.find(r=>r.id===id&&r.date===d&&r.type===t)||{}).time||'';
  const rows=[['날짜','이름','생년월일','전화번호','출근','퇴근','조퇴']].concat(ids.map(id=>{const w=workers.find(x=>x.id===id)||{};return[d,w.name||'',w.birth||'',w.phone||'',tm(id,'in'),tm(id,'out'),tm(id,'early')]}));
  const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='출퇴근_'+d+'.csv';a.click();
};
$('#pr').onclick=()=>window.print();$('#qp').onclick=()=>window.print();
function drawQR(){
  ['in','out'].forEach(k=>{const el=$('#q-'+k);el.innerHTML='';
    if(window.QRCode)new QRCode(el,{text:base+(base.includes('?')?'&':'?')+'a='+k,width:200,height:200,correctLevel:QRCode.CorrectLevel.M});
    else el.textContent='QR 라이브러리를 불러오지 못했습니다'});
}
$('#bus').onclick=()=>{const v=$('#bu').value.trim();if(!/^https?:\/\//.test(v))return toast('https:// 로 시작하는 주소를 입력해 주세요');base=v;S('base',v);drawQR();toast('주소를 저장했습니다')};
$('#nps').onclick=()=>{const v=$('#np').value;if(v.length<4)return toast('PIN은 4자리 이상으로 정해 주세요');pin=v;S('pin',v);$('#np').value='';toast('PIN을 바꿨습니다')};

/* QR로 접속한 경우 근로자 화면 */
goW();
</script>
</body>
</html>
