<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>출퇴근 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 근로자 화면은 480px 단일 열(휴대폰), 관리자 화면은 넓은 표 중심. 모드 색으로 출근(청록)/퇴근(주황)/관리자(남색)를 구분 */
:root{
  --ink:#14232d; --muted:#586a73; --paper:#eef2f1; --card:#ffffff; --line:#d3dcda; --field:#ffffff;
  --brand:#12405f; --brand-fg:#ffffff;
  --in:#0b7a6b; --in-bg:#dff3ef;
  --out:#b95408; --out-bg:#fbe9d8;
  --early:#7a3a96; --early-bg:#f0e4f6;
  --bad:#b3261e; --bad-bg:#fbe3e1; --ok:#1a7f3c;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --ink:#e6eef0; --muted:#9bb0b8; --paper:#0f1a20; --card:#17252d; --line:#2a3b44; --field:#0f1a20;
    --brand:#5aa7d6; --brand-fg:#06202f;
    --in:#52d1bd; --in-bg:#12332f;
    --out:#f2a05b; --out-bg:#3a2713;
    --early:#d3a4ea; --early-bg:#2e1f38;
    --bad:#ff8a80; --bad-bg:#3a1a18; --ok:#6fd58c;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
h2{font-size:20px;font-weight:800}
h3{font-size:16px;font-weight:700}
p{margin:0}
.small{font-size:13px;color:var(--muted)}
a{color:var(--brand)}
button,input,select{font:inherit;color:inherit}

header.top{position:sticky;top:0;z-index:5;color:#fff;background:var(--brand);padding-top:env(safe-area-inset-top,0px)}
header.top.in{background:#0b6f61}
header.top.out{background:#a64b07}
header.top.admin{background:#12405f}
@media (prefers-color-scheme:dark){
  header.top.in{background:#0d4a42} header.top.out{background:#6b3408} header.top.admin{background:#173b52}
}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
.top-in b{font-size:17px;font-weight:800}
.top-in .mono{font-size:15px;opacity:.95}
.top-in .right{display:flex;align-items:center;gap:12px}
.top-in button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}

.banner{background:#fff4d6;color:#5b4300;font-size:13px;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));text-align:center}
@media (prefers-color-scheme:dark){.banner{background:#3a3014;color:#f3dc9b}}

.wrap{padding:18px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:1100px;margin:0 auto}
.wrap.narrow{max-width:480px}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.panel.done{border-color:var(--ok)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:9px 6px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}

label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=tel],input[type=password],input[type=date],input[type=time],input[type=search],input[type=url],select{
  background:var(--field);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent);outline-offset:1px}

.btn{border:0;border-radius:10px;padding:14px 16px;font-weight:800;font-size:16px;cursor:pointer;background:var(--brand);color:var(--brand-fg);width:100%}
.btn.in{background:var(--in);color:#fff} .btn.out{background:var(--out);color:#fff} .btn.early{background:var(--early);color:#fff}
@media (prefers-color-scheme:dark){.btn.in,.btn.out,.btn.early{color:#0b1216}}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.ghost.sm{padding:5px 10px;font-size:13px}
.ghost.danger{color:var(--bad);border-color:var(--bad)}
.msg{font-size:14px;font-weight:600;color:var(--bad);min-height:1.2em}
.msg.ok{color:var(--ok)}

.sigbox{position:relative;border:2px dashed var(--line);border-radius:10px;background:#fff;overflow:hidden}
.sigbox canvas{display:block;width:100%;aspect-ratio:8/3;touch-action:none;cursor:crosshair}
.sigbox .hint{position:absolute;inset:0;display:grid;place-items:center;color:#9aa7ad;font-size:15px;pointer-events:none}
.sigbox .clr{position:absolute;right:8px;bottom:8px}
.sigbox .clr{background:#fff;color:#14232d;border-color:#c9d3d1}

.who{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.who b{font-size:20px}
.bigtime{font-family:var(--f-mono);font-size:34px;font-weight:600;letter-spacing:-.5px}
.tag{display:inline-block;border-radius:6px;padding:1px 8px;font-size:12px;font-weight:700}
.tag.out{background:var(--out-bg);color:var(--out)} .tag.early{background:var(--early-bg);color:var(--early)} .tag.in{background:var(--in-bg);color:var(--in)}
img.sigimg{display:block;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:6px}

/* 관리자 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 16px;font-weight:700;cursor:pointer;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar .grow{flex:1 1 160px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.stat b{font-family:var(--f-mono);font-size:24px}
.stat.in b{color:var(--in)} .stat.out b{color:var(--out)} .stat.early b{color:var(--early)} .stat.miss b{color:var(--bad)}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:14px}
th{font-size:12px;color:var(--muted);background:var(--paper);font-weight:700;white-space:nowrap}
td.num{color:var(--muted);width:40px}
td.nm{font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
img.sig{height:34px;width:auto;display:block;background:#fff;border:1px solid var(--line);border-radius:4px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.qrcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.qrcard svg{width:min(100%,260px);height:auto;background:#fff;border-radius:6px}
.qrcard .url{font-family:var(--f-mono);font-size:11px;word-break:break-all;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(5,15,22,.55);display:grid;place-items:center;padding:16px;z-index:20;overflow:auto}
.modal{background:var(--card);border-radius:12px;padding:18px;width:min(100%,420px);display:flex;flex-direction:column;gap:12px;max-height:100%;overflow:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#14232d;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw}

#printRoot{display:none}
#printRoot h1{font-size:18px;margin-bottom:6px}
#printRoot table{min-width:0;width:100%}
#printRoot th,#printRoot td{border:1px solid #888;color:#000;background:#fff;padding:4px 6px;font-size:11px}
#printRoot img.sig{height:30px;border:0}
.qrprint{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.qrprint div{text-align:center}
.qrprint h2{font-size:30px;margin-bottom:10px;color:#000}
.qrprint svg{width:320px;height:320px}
@media print{
  body{background:#fff}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important;color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="printRoot"></div>
<style id="pageStyle"></style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';

/* ───────── 설정 ─────────
   SERVER_URL 이 비어 있으면 '체험 모드'(이 기기 브라우저에만 저장)로 동작합니다.
   여러 휴대폰이 같은 기록을 공유하려면 Apps Script 웹앱 URL을 아래에 붙여 넣으세요. */
const SERVER_URL = '';
const LOCAL = !SERVER_URL;
const LOCAL_PW = '0000';

/* ───────── 공통 도구 ───────── */
const $ = (s, r) => (r || document).querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmtDate = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const fmtTime = d => pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
const DOW = ['일','월','화','수','목','금','토'];
const hm = t => t ? String(t).slice(0, 5) : '';
const dateLabel = ds => { const d = new Date(ds + 'T00:00:00'); return ds + ' (' + DOW[d.getDay()] + ')'; };
const nName = s => String(s || '').replace(/\s+/g, '');
const nDigits = s => String(s || '').replace(/\D/g, '');
const rnd = (n) => { const a = new Uint8Array(n || 12); crypto.getRandomValues(a); return Array.from(a, x => (x % 36).toString(36)).join(''); };

const MSG = {
  notfound: '등록되지 않은 정보입니다. 신규 등록을 해 주세요.',
  exists: '이미 등록된 근로자입니다. 본인확인으로 진행해 주세요.',
  conflict: '이름·생년월일 또는 전화번호가 기존 등록과 겹칩니다. 관리자에게 문의해 주세요.',
  badkey: 'QR 코드가 유효하지 않습니다. 현장의 QR을 다시 스캔해 주세요.',
  dup_in: '오늘 이미 출근 기록이 있습니다.',
  dup_out: '오늘 이미 퇴근(조퇴) 기록이 있습니다.',
  no_in: '오늘 출근 기록이 없습니다. 관리자에게 문의해 주세요.',
  nosig: '서명을 해 주세요.',
  noreason: '조퇴 사유를 입력해 주세요.',
  badpw: '비밀번호가 맞지 않습니다.',
  invalid: '입력 형식을 확인해 주세요.',
  network: '서버에 연결할 수 없습니다. 잠시 후 다시 시도해 주세요.',
  server: '서버 오류가 발생했습니다. 관리자에게 문의해 주세요.'
};

let toastTimer = null;
function toast(t) {
  let el = $('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = t;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2200);
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {}
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  return ok;
}

/* ───────── 체험 모드 저장소(브라우저) ───────── */
const LK = 'ec_attendance_v1';
function ldb() {
  try { const d = JSON.parse(localStorage.getItem(LK)); if (d && d.workers) return d; } catch (e) {}
  return { workers: [], recs: [], sigs: {}, keys: { inKey: rnd(), outKey: rnd() } };
}
function lsave(d) { try { localStorage.setItem(LK, JSON.stringify(d)); } catch (e) {} }
function validIdent(p) {
  const name = String(p.name || '').trim().replace(/\s+/g, ' ');
  const birth = nDigits(p.birth), phone = nDigits(p.phone);
  if (name.length < 2 || name.length > 20) return null;
  if (!/^\d{8}$/.test(birth)) return null;
  const y = +birth.slice(0, 4), m = +birth.slice(4, 6), dd = +birth.slice(6, 8);
  const t = new Date(y, m - 1, dd);
  if (y < 1900 || t.getFullYear() !== y || t.getMonth() !== m - 1 || t.getDate() !== dd || t > new Date()) return null;
  if (!/^0\d{9,10}$/.test(phone)) return null;
  return { name, birth, phone };
}
function localApi(a, p) {
  const d = ldb(); lsave(d);
  const now = new Date(), today = fmtDate(now);
  const needAdmin = () => p.pw !== LOCAL_PW;
  const findW = v => d.workers.find(w => nName(w.name) === nName(v.name) && w.birth === v.birth && w.phone === v.phone);
  const recOf = (date, wid) => d.recs.find(r => r.date === date && r.wid === wid) || null;
  const clone = o => o ? JSON.parse(JSON.stringify(o)) : o;
  switch (a) {
    case 'checkKey':
      return { ok: p.key === (p.type === 'in' ? d.keys.inKey : d.keys.outKey) };
    case 'register': {
      const v = validIdent(p); if (!v) return { error: 'invalid' };
      if (findW(v)) return { error: 'exists' };
      if (d.workers.some(w => w.phone === v.phone || (nName(w.name) === nName(v.name) && w.birth === v.birth))) return { error: 'conflict' };
      const w = { id: 'W' + rnd(8), name: v.name, birth: v.birth, phone: v.phone, createdAt: today + ' ' + fmtTime(now) };
      d.workers.push(w); lsave(d);
      return { ok: true, worker: { id: w.id, name: w.name }, rec: null };
    }
    case 'verify': {
      const v = validIdent(p); if (!v) return { error: 'invalid' };
      const w = findW(v); if (!w) return { error: 'notfound' };
      return { ok: true, worker: { id: w.id, name: w.name }, rec: clone(recOf(today, w.id)) };
    }
    case 'clock': {
      const v = validIdent(p); if (!v) return { error: 'invalid' };
      const w = findW(v); if (!w) return { error: 'notfound' };
      const want = p.type === 'in' ? d.keys.inKey : d.keys.outKey;
      if (p.key !== want) return { error: 'badkey' };
      if (!p.sig) return { error: 'nosig' };
      let r = recOf(today, w.id);
      const t = fmtTime(now);
      if (p.type === 'in') {
        if (r && r.inT) return { error: 'dup_in', rec: clone(r) };
        if (!r) { r = { date: today, wid: w.id, name: w.name, inT: '', outT: '', outType: '', reason: '', memo: '' }; d.recs.push(r); }
        r.inT = t; d.sigs[today + '|' + w.id + '|in'] = p.sig;
      } else {
        if (!r || !r.inT) return { error: 'no_in' };
        if (r.outT) return { error: 'dup_out', rec: clone(r) };
        const reason = String(p.reason || '').trim().slice(0, 100);
        if (p.type === 'early' && !reason) return { error: 'noreason' };
        r.outT = t; r.outType = p.type === 'early' ? '조퇴' : '퇴근'; r.reason = p.type === 'early' ? reason : '';
        d.sigs[today + '|' + w.id + '|out'] = p.sig;
      }
      lsave(d);
      return { ok: true, rec: clone(r) };
    }
    case 'adminKeys':
      if (needAdmin()) return { error: 'badpw' };
      return { ok: true, keys: d.keys };
    case 'adminRotate':
      if (needAdmin()) return { error: 'badpw' };
      d.keys = { inKey: rnd(), outKey: rnd() }; lsave(d);
      return { ok: true, keys: d.keys };
    case 'adminList': {
      if (needAdmin()) return { error: 'badpw' };
      const recs = d.recs.filter(r => r.date === p.date).map(clone);
      const sigs = {};
      Object.keys(d.sigs).forEach(k => { if (k.indexOf(p.date + '|') === 0) sigs[k] = d.sigs[k]; });
      return { ok: true, recs, sigs };
    }
    case 'adminWorkers':
      if (needAdmin()) return { error: 'badpw' };
      return { ok: true, workers: d.workers.map(clone) };
    case 'adminDelWorker':
      if (needAdmin()) return { error: 'badpw' };
      d.workers = d.workers.filter(w => w.id !== p.wid); lsave(d);
      return { ok: true };
    case 'adminUpdate': {
      if (needAdmin()) return { error: 'badpw' };
      let r = recOf(p.date, p.wid);
      if (p.remove) {
        d.recs = d.recs.filter(x => x !== r);
        delete d.sigs[p.date + '|' + p.wid + '|in']; delete d.sigs[p.date + '|' + p.wid + '|out'];
        lsave(d); return { ok: true };
      }
      const w = d.workers.find(x => x.id === p.wid);
      if (!r) { r = { date: p.date, wid: p.wid, name: w ? w.name : (p.name || ''), inT: '', outT: '', outType: '', reason: '', memo: '' }; d.recs.push(r); }
      r.inT = p.inT || ''; r.outT = p.outT || '';
      r.outType = r.outT ? (p.outType === '조퇴' ? '조퇴' : '퇴근') : '';
      r.reason = r.outType === '조퇴' ? String(p.reason || '').slice(0, 100) : '';
      r.memo = '관리자 수정 ' + today + ' ' + hm(fmtTime(now));
      lsave(d);
      return { ok: true };
    }
  }
  return { error: 'server' };
}

async function api(action, data) {
  const payload = Object.assign({ action }, data || {});
  if (LOCAL) return localApi(action, payload);
  try {
    const r = await fetch(SERVER_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
    return await r.json();
  } catch (e) { return { error: 'network' }; }
}

/* ───────── 공통 화면 조각 ───────── */
let clockTimer = null;
function header(title, cls, right) {
  return '<header class="top ' + cls + '"><div class="top-in"><b>' + esc(title) + '</b><span class="right">' + (right || '<span id="clk" class="mono"></span>') + '</span></div></header>';
}
function banner() {
  return LOCAL ? '<div class="banner">체험 모드 · 기록이 이 휴대폰 브라우저에만 저장됩니다. 여러 기기에서 쓰려면 서버를 연결하세요.</div>' : '';
}
function startClock() {
  clearInterval(clockTimer);
  const tick = () => { const el = $('#clk'); if (el) { const n = new Date(); el.textContent = fmtDate(n).slice(5).replace('-', '.') + ' (' + DOW[n.getDay()] + ') ' + fmtTime(n); } };

function sigPad(canvas, hint) {
  const ctx = canvas.getContext('2d');
  let drawing = false, last = null;
  const pad = { dirty: false };
  function reset() {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#10202b'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    pad.dirty = false; if (hint) hint.hidden = false;
  }
  function pos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };
  }
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); drawing = true; last = pos(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (x) {}
    ctx.beginPath(); ctx.arc(last.x, last.y, 2, 0, 6.3); ctx.fillStyle = '#10202b'; ctx.fill();
    pad.dirty = true; if (hint) hint.hidden = true;
  });
  canvas.addEventListener('pointermove', e => {
    if (!drawing) return; e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
  });
  const end = () => { drawing = false; };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', end);
  pad.clear = reset;
  pad.data = () => {
    const o = document.createElement('canvas'); o.width = 320; o.height = 120;
    const c = o.getContext('2d'); c.fillStyle = '#fff'; c.fillRect(0, 0, 320, 120);
    c.drawImage(canvas, 0, 0, 320, 120);
    return o.toDataURL('image/png');
  };
  reset();
  return pad;
}

    '<h3>' + (isIn ? '출근 서명' : '서명') + '</h3>' +
    '<div class="sigbox"><canvas id="sig" width="640" height="240" aria-label="서명란"></canvas><div class="hint" id="sigHint">여기에 손가락으로 서명하세요</div><button type="button" class="ghost sm clr" id="sigClr">지우기</button></div>' +
    '<div class="msg" id="aMsg" role="alert"></div>' +
    '<button class="btn ' + kind + '" id="aGo">' + (isIn ? '출근 기록' : '퇴근 기록') + '</button></div>');
  const sp = sigPad($('#sig'), $('#sigHint'));
  const say = t => { $('#aMsg').textContent = t || ''; };
  $('#sigClr').onclick = () => sp.clear();
  if (!isIn) {
    const setKind = k => {
      kind = k;

      $('#rsWrap').hidden = k !== 'early';

    };

  }

    if (!sp.dirty) { say(MSG.nosig); return; }

  modal('<h3>' + esc(r.name) + ' · ' + dateLabel(r.date) + '</h3>' +
    '<div class="row2"><label class="f">출근 시각<input type="time" id="eIn" value="' + hm(r.inT) + '"></label>' +
    '<label class="f">퇴근 시각<input type="time" id="eOut" value="' + hm(r.outT) + '"></label></div>' +
    '<label class="f">구분<select id="eType"><option value="퇴근">퇴근</option><option value="조퇴">조퇴</option></select></label>' +
    '<label class="f" id="eRsW">조퇴 사유<input type="text" id="eRs" maxlength="100" value="' + esc(r.reason || '') + '"></label>' +
    '<div class="msg" id="eMsg"></div>' +
    '<div class="bar"><button class="btn" id="eSave" style="flex:1">저장</button><button class="ghost" id="eCancel">취소</button></div>' +
    '<button class="ghost danger" id="eDel">기록 삭제</button>');
  $('#eType').value = r.outType === '조퇴' ? '조퇴' : '퇴근';
  const sync = () => { $('#eRsW').hidden = $('#eType').value !== '조퇴'; };
  $('#eType').onchange = sync; sync();
  $('#eCancel').onclick = closeModal;
  $('#eSave').onclick = async () => {
    const res = await api('adminUpdate', { pw: A.pw, date: r.date, wid: r.wid, name: r.name, inT: $('#eIn').value, outT: $('#eOut').value, outType: $('#eType').value, reason: $('#eRs').value });
    if (authFail(res)) return;
    if (!res.ok) { $('#eMsg').textContent = MSG[res.error] || MSG.network; return; }
    closeModal(); toast('수정했습니다.'); tabList();
  };
  let armed = false;
  $('#eDel').onclick = async () => {
    if (!armed) { armed = true; $('#eDel').textContent = '한 번 더 누르면 삭제됩니다'; setTimeout(() => { armed = false; const b = $('#eDel'); if (b) b.textContent = '기록 삭제'; }, 3000); return; }
    const res = await api('adminUpdate', { pw: A.pw, date: r.date, wid: r.wid, remove: true });
    if (authFail(res)) return;
    closeModal(); toast('삭제했습니다.'); tabList();
  };
}
async function addModal() {
  const w = await api('adminWorkers', { pw: A.pw });
  if (authFail(w)) return;
  const list = (w.workers || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  if (!list.length) { toast('등록된 근로자가 없습니다.'); return; }
  modal('<h3>수기 추가 · ' + dateLabel(A.date) + '</h3>' +
    '<label class="f">근로자<select id="aW">' + list.map(x => '<option value="' + esc(x.id) + '">' + esc(x.name) + ' (' + esc(x.birth.slice(2)) + ')</option>').join('') + '</select></label>' +
    '<div class="row2"><label class="f">출근 시각<input type="time" id="aIn"></label><label class="f">퇴근 시각<input type="time" id="aOut"></label></div>' +
    '<label class="f">구분<select id="aType"><option value="퇴근">퇴근</option><option value="조퇴">조퇴</option></select></label>' +
    '<label class="f" id="aRsW" hidden>조퇴 사유<input type="text" id="aRs" maxlength="100"></label><div class="msg" id="aM"></div>' +
    '<div class="bar"><button class="btn" id="aSave" style="flex:1">추가</button><button class="ghost" id="aCancel">취소</button></div>');
  $('#aType').onchange = () => { $('#aRsW').hidden = $('#aType').value !== '조퇴'; };
  $('#aCancel').onclick = closeModal;
  $('#aSave').onclick = async () => {
    if (!$('#aIn').value && !$('#aOut').value) { $('#aM').textContent = '출근 또는 퇴근 시각을 입력해 주세요.'; return; }
    const wk = list.find(x => x.id === $('#aW').value);
    const res = await api('adminUpdate', { pw: A.pw, date: A.date, wid: wk.id, name: wk.name, inT: $('#aIn').value, outT: $('#aOut').value, outType: $('#aType').value, reason: $('#aRs').value });
    if (authFail(res)) return;
    if (!res.ok) { $('#aM').textContent = MSG[res.error] || MSG.network; return; }
    closeModal(); toast('추가했습니다.'); tabList();
  };
}

/* 근로자 목록 */
async function tabWorkers() {
  body().innerHTML = '<div class="stack"><div class="bar"><input type="search" id="q" class="grow" placeholder="이름·전화번호 검색"><span class="small" id="cnt"></span></div><div class="tablewrap" id="wt"><div class="empty">불러오는 중…</div></div></div>';
  const r = await api('adminWorkers', { pw: A.pw });
  if (authFail(r)) return;
  if (!r.ok) { $('#wt').innerHTML = '<div class="empty">' + esc(MSG[r.error] || MSG.network) + '</div>'; return; }
  A.workers = (r.workers || []).slice().sort((a, b) => a.name.localeCompare(b.name, 'ko'));
  const draw = () => {
    const q = $('#q').value.trim().toLowerCase(), qd = nDigits(q);
    const rows = A.workers.filter(w => !q || w.name.toLowerCase().includes(q) || (qd && w.phone.includes(qd)));
    $('#cnt').textContent = rows.length + '명';
    $('#wt').innerHTML = rows.length ?
      '<table style="min-width:560px"><thead><tr><th>이름</th><th>생년월일</th><th>전화번호</th><th>등록일시</th><th></th></tr></thead><tbody>' +
      rows.map(w => '<tr><td class="nm">' + esc(w.name) + '</td><td class="mono">' + esc(w.birth) + '</td><td class="mono">' + esc(w.phone.replace(/^(\d{3})(\d{3,4})(\d{4})$/, '$1-$2-$3')) + '</td><td class="small">' + esc(w.createdAt || '') + '</td><td><button class="ghost sm danger" data-del="' + esc(w.id) + '">삭제</button></td></tr>').join('') + '</tbody></table>'
      : '<div class="empty">등록된 근로자가 없습니다. 근로자가 QR을 스캔해 신규 등록하면 여기에 표시됩니다.</div>';
    $('#wt').querySelectorAll('[data-del]').forEach(b => {
      let armed = false;
      b.onclick = async () => {
        if (!armed) { armed = true; b.textContent = '정말 삭제'; setTimeout(() => { armed = false; b.textContent = '삭제'; }, 3000); return; }
        const res = await api('adminDelWorker', { pw: A.pw, wid: b.dataset.del });
        if (authFail(res)) return;
        toast('삭제했습니다.'); tabWorkers();
      };
    });
  };
  $('#q').oninput = draw; draw();
}

/* QR 발급 */
function qrSvg(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 2; let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += 'M' + (c + m) + ',' + (r + m) + 'h1v1h-1z';
  const s = n + m * 2;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + s + ' ' + s + '" shape-rendering="crispEdges" role="img"><rect width="' + s + '" height="' + s + '" fill="#fff"/><path d="' + d + '" fill="#000"/></svg>';
}
function baseUrl() {
  let b = '';
  try { b = localStorage.getItem('ec_base') || ''; } catch (e) {}
  return b || (location.origin + location.pathname);
}
function tabQR() {
  if (typeof qrcode === 'undefined') { body().innerHTML = '<div class="panel bad">QR 생성 도구를 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침해 주세요.</div>'; return; }
  const draw = () => {
    const base = ($('#base').value || baseUrl()).split('?')[0].split('#')[0];
    const inUrl = base + '?m=in&k=' + A.keys.inKey, outUrl = base + '?m=out&k=' + A.keys.outKey;
    A._qr = { inUrl, outUrl };
    $('#qrs').innerHTML =
      '<div class="qrcard"><span class="tag in">출근 QR</span>' + qrSvg(inUrl) + '<div class="url">' + esc(inUrl) + '</div></div>' +
      '<div class="qrcard"><span class="tag out">퇴근 · 조퇴 QR</span>' + qrSvg(outUrl) + '<div class="url">' + esc(outUrl) + '</div></div>';
  };
  body().innerHTML = '<div class="stack"><div class="panel"><h3>접속 주소</h3>' +
    '<p class="small">근로자가 휴대폰으로 열 이 페이지의 인터넷 주소입니다. 맞지 않으면 직접 고쳐 주세요.</p>' +
    '<input type="url" id="base" value="' + esc(baseUrl()) + '">' +
    '<div class="bar"><button class="ghost" id="qPrint">QR 출력 (A4)</button><button class="ghost" id="qRot">QR 새로 발급</button></div>' +
    '<p class="small">‘새로 발급’을 누르면 이전에 출력한 QR은 사용할 수 없게 됩니다.</p></div>' +
    '<div class="qrgrid" id="qrs"></div></div>';
  $('#base').oninput = () => { try { localStorage.setItem('ec_base', $('#base').value); } catch (e) {} draw(); };
  $('#qPrint').onclick = () => doPrint(
    '<div class="qrprint"><div><h2>출근 QR</h2>' + qrSvg(A._qr.inUrl) + '</div><div><h2>퇴근 · 조퇴 QR</h2>' + qrSvg(A._qr.outUrl) + '</div></div><p style="text-align:center;margin-top:24px;color:#000">휴대폰 카메라로 스캔한 뒤 이름 · 생년월일 · 전화번호를 확인하고 서명하세요.</p>',
    '@page{size:A4 portrait;margin:15mm}');
  let armed = false;
  $('#qRot').onclick = async () => {
    const b = $('#qRot');
    if (!armed) { armed = true; b.textContent = '정말 새로 발급'; setTimeout(() => { armed = false; b.textContent = 'QR 새로 발급'; }, 3000); return; }
    const r = await api('adminRotate', { pw: A.pw });
    if (authFail(r)) return;
    if (r.ok) { A.keys = r.keys; armed = false; b.textContent = 'QR 새로 발급'; draw(); toast('새 QR을 발급했습니다.'); }
  };
  draw();
}

/* ───────── 시작 ───────── */
if (S.mode === 'in' || S.mode === 'out') viewWorker();
else if (S.mode === 'admin') viewAdmin();
else viewLanding();
})();
</script>
